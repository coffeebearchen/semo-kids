<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEMO Kids — 情绪小测试 MVP v2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: linear-gradient(135deg, #fdfbfb, #ebedee);
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px 20px 28px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #333;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #777;
      margin-bottom: 18px;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fff3cd;
      color: #b08900;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 999px;
      border: none;
      background: #ff9f1c;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 159, 28, 0.4);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      margin-top: 4px;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(255, 159, 28, 0.5);
    }

    .btn:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(255, 159, 28, 0.4);
      opacity: 0.9;
    }

    .emoji-panel {
      margin-top: 14px;
      display: none;
      flex-wrap: wrap;
